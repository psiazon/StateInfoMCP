
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateinfomcp
  labels:
    app: stateinfomcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: stateinfomcp
  template:
    metadata:
      labels:
        app: stateinfomcp
    spec:
      containers:
        - name: stateinfomcp
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001

          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8001"
            - name: STATEINFO_API_BASE_URL
              value: "http://stateinfowebapi:8000"

          startupProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: stateinfomcp
spec:
  type: ClusterIP
  selector:
    app: stateinfomcp
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
